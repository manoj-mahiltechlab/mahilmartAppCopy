plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
}

// ✅ React Native config
react {
    project.ext.vectoricons = [
        iconFontNames: ['MaterialCommunityIcons.ttf', 'MaterialIcons.ttf', 'Ionicons.ttf']
    ]
    autolinkLibrariesWithApp()
}

// ✅ vector icons font linking (must be outside `react {}`)
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def jscFlavor = 'io.github.react-native-community:jsc-android:241213.1.0'

// ✅ Use true/false flags
def enableProguardInReleaseBuilds = true

android {
    namespace "com.grocery_app"

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.grocery_app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file('my-key.keystore')
            storePassword 'mahilmartapp@raja'
            keyAlias 'my-key-alias'
            keyPassword 'mahilmartapp@raja'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // ✅ Location services
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // ✅ AndroidX Startup and WorkManager
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.work:work-runtime:2.9.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// ✅ Force Kotlin versions to avoid conflicts
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:2.0.21"
        force "org.jetbrains.kotlin:kotlin-reflect:2.0.21"
    }
}
